# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
# Dependabot can only reach hosts on its default egress allowlist or declared
# here, even when a registry allows anonymous access. These are the Maven
# repositories from the poms that its proxy blocked.
registries:
  magemonkey-releases:
    type: maven-repository
    url: https://repo.travja.dev/releases
  magemonkey-snapshots:
    type: maven-repository
    url: https://repo.travja.dev/snapshots
  elmakers:
    type: maven-repository
    url: https://maven.elmakers.com/repository/
  neetgames:
    type: maven-repository
    url: https://nexus.neetgames.com/repository/maven-releases/
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "build:patch"
    registries:
      - magemonkey-releases
      - magemonkey-snapshots
      - elmakers
      - neetgames
    open-pull-requests-limit: 10
    reviewers:
      - Travja
    ignore:
      - dependency-name: "org.spigotmc:spigot-api"
